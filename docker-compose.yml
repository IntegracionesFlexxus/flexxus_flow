version: '3.8'

# Docker Compose para Flexxus Flow
# PostgreSQL + Backend + Frontend
services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: flexxus-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - flexxus-network

  # PgAdmin (Opcional - para gestionar DB via web)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: flexxus-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@flexxus.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - flexxus-network
    profiles:
      - admin

volumes:
  postgres_data:
    driver: local

networks:
  flexxus-network:
    driver: bridge
    name: flexxus-network